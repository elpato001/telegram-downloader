name: telegram-downloader
services:
  telegram-downloader:
    image: ghcr.io/elpato001/telegram-downloader:latest
    container_name: telegram-downloader
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Acceso al almacenamiento principal y discos en ZimaOS / CasaOS
      - /DATA:/DATA
      - /media:/media
      
      # Persistencia de datos y descargas en ZimaOS
      - /DATA/AppData/telegram-downloader/data:/app/data
      - /DATA/AppData/telegram-downloader/descargas:/app/descargas
      
    environment:
      - DATA_DIR=/app/data
      - TZ=America/Argentina/Buenos_Aires

x-casaos:
  architectures:
    - amd64
    - arm64
  main: telegram-downloader
  icon: https://raw.githubusercontent.com/elpato001/telegram-downloader/main/assets/logo.png
  title:
    en_us: Telegram Downloader
    es_es: Telegram Downloader
  port_map: "8000"
  scheme: http
  description:
    en_us: Web-based Telegram Media Downloader with QR login, batch downloads, and disk browser.
    es_es: Descargador web de archivos de Telegram con QR, descargas masivas y explorador de discos.
